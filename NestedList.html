<!DOCTYPE html>
<html lang="en">
<head>
  <title>Nested List</title>
</head>
<body>
  <!-- NESTED LIST 1 -->
   <ol type="1">
    <li>Java</li>
    <ul type="disc">
      <li>Pavan</li>
      <li>Ajit</li>
      <li>Praveen</li>
    </ul>
    <li>Python</li>
    <ul type="disc">
      <li>Monty</li>
      <li>Deva</li>
      <li>Neeha</li>
    </ul>
   </ol>
   <!-- NESTED LIST 2 -->
    <ul type="square">
      <li>Food Items</li>
      <ol type="1">
        <li>Veg</li>
        <ol type="a">
          <li>Paneer</li>
          <ul type="disc">
            <li>Biryani</li>
            <li>Tikka</li>
          </ul>
        </ol>
        <li>Non-Veg</li>
        <ol type="a">
          <li>Chicken</li>
          <ul type="disc">
            <li>Biryani</li>
            <li>65</li>
          </ul>
        </ol>
      </ol>
    </ul>
</body>
</html>
